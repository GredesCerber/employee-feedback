services:
  - type: web
    name: employee-feedback-api
    runtime: node
    buildCommand: "npm --prefix api ci && npm --prefix api run build"
    startCommand: "npm --prefix api start"
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW_S
        value: "60"
