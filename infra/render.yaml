# Render Blueprint: один бесплатный Docker-сервис. DATABASE_URL (строка Neon) задаётся в панели Render.
services:
  - type: web
    name: employee-feedback
    runtime: docker
    plan: free
    dockerfilePath: ./infra/hosted.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      # Даты демо-данных считаются от дня первого наполнения, а не от 1 ноября (#215).
      - key: SEED_RELATIVE_DATES
        value: "1"
      # Фоновые боты: подают обращения, берут в работу, отвечают и закрывают (помечены «Имитация»).
      - key: DEMO_BOT_ENABLED
        value: "true"
      # ИИ-цепочка: Gemini, затем второй провайдер (xAI или Groq), затем правила без ИИ. Ключи задаются только в панели Render.
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Таймаут одного обращения к провайдеру, мс (500..30000).
      - key: AI_TIMEOUT_MS
        value: "5000"
