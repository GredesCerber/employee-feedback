server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API контракта живёт без префикса: /api/complaints → http://api:3000/complaints
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    try_files $uri =404;
    expires 7d;
  }

  # Маршруты SPA (/submit, /my/..., /queue/..., /summary) отдаются как index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
