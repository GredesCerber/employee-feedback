{
  "openapi": "3.1.0",
  "info": {
    "title": "Employee Feedback MVP API",
    "version": "1.0.0",
    "description": "Contract for R1-R7 and all six demo steps. Synthetic data only. JSON syntax is used as a YAML 1.2 subset so acceptance tests require only Node. Demo identity selection is a simulation, not production authentication. No anonymous submissions, real file uploads, notifications or external integrations. See x-demo-flow, x-access-policy and x-status-transitions.",
    "contact": {
      "name": "Employee Feedback team",
      "url": "https://github.com/GredesCerber/employee-feedback"
    }
  },
  "servers": [
    {
      "url": "http://localhost:3000",
      "description": "Local synthetic-data API; deployment may override the origin, paths remain identical."
    }
  ],
  "tags": [
    {
      "name": "Context",
      "description": "Demo identity and form reference data"
    },
    {
      "name": "Complaints",
      "description": "Registration, routing and lifecycle"
    },
    {
      "name": "Analytics",
      "description": "Administrative aggregates"
    }
  ],
  "security": [
    {
      "DemoIdentity": []
    }
  ],
  "x-access-policy": {
    "employee": "Create and read own complaints, comment and answer clarification on own nonterminal complaints. Cannot change fields, assign, change status directly or decide.",
    "manager": "Read all complaints across departments, assign eligible managers, comment/request clarification, change status and decide. No create or aggregate analytics.",
    "admin": "Read all complaints, reference data and summary. No complaint mutation. Category/routing administration is future scope.",
    "authorization": "Apply role authorization before mutation. For permitted roles, hide foreign complaint existence from employees with 404. Known but forbidden role=403; missing/unknown demo identity=401. Text is plain text; UI escapes it. Unknown body/query fields, duplicate query keys, invalid formats or whitespace-only required text=422. Malformed JSON=400. Mutations are atomic; errors leave data/history unchanged."
  },
  "x-demo-identities": [
    {
      "id": "employee-1",
      "role": "employee",
      "departmentId": "procurement"
    },
    {
      "id": "employee-2",
      "role": "employee",
      "departmentId": "accounting"
    },
    {
      "id": "manager-1",
      "role": "manager",
      "departmentId": "procurement"
    },
    {
      "id": "admin-1",
      "role": "admin",
      "departmentId": "administration"
    }
  ],
  "x-status-transitions": {
    "new": [
      "in_review",
      "awaiting_clarification",
      "rejected"
    ],
    "in_review": [
      "in_progress",
      "awaiting_clarification",
      "implemented",
      "rejected",
      "closed"
    ],
    "in_progress": [
      "in_review",
      "awaiting_clarification",
      "implemented",
      "rejected",
      "closed"
    ],
    "awaiting_clarification": [
      "in_review"
    ],
    "implemented": [],
    "rejected": [],
    "closed": []
  },
  "x-demo-flow": [
    {
      "step": 1,
      "requirements": [
        "R1",
        "R5"
      ],
      "operations": [
        "getSession",
        "getReferenceData",
        "createComplaint"
      ],
      "scenario": "employee-1 creates problem with category, text, optional solution and a synthetic attachment placeholder."
    },
    {
      "step": 2,
      "requirements": [
        "R2"
      ],
      "operations": [
        "createComplaint",
        "getComplaint",
        "listComplaints",
        "assignComplaint"
      ],
      "scenario": "Create with category that has an assignee, then with one whose assigneeId is null. manager-1 sees queue=unassigned and assigns a manager."
    },
    {
      "step": 3,
      "requirements": [
        "R3"
      ],
      "operations": [
        "changeComplaintStatus",
        "addComment",
        "getComplaint"
      ],
      "scenario": "manager-1 moves new to in_review, posts clarification_request; employee-1 posts clarification_response, returning to in_review."
    },
    {
      "step": 4,
      "requirements": [
        "R4"
      ],
      "operations": [
        "recordDecision",
        "getComplaint"
      ],
      "scenario": "manager-1 records implemented on one reviewed complaint and rejected with explanation on another. Author reads both results."
    },
    {
      "step": 5,
      "requirements": [
        "R6"
      ],
      "operations": [
        "listComplaints",
        "getComplaint"
      ],
      "scenario": "manager-1 filters departmentId/categoryId/status/dueBefore/dueAfter/overdue and opens history."
    },
    {
      "step": 6,
      "requirements": [
        "R7"
      ],
      "operations": [
        "getSummary"
      ],
      "scenario": "admin-1 reads counts, closed share, mean first response and recurring category topics."
    }
  ],
