      "get": {
        "operationId": "listComplaints",
        "summary": "List visible complaints with filters",
        "description": "Employees see only their own complaints. Managers and admins see all synthetic complaints, including unassigned across departments. Apply access restriction before all filters, totals and pagination. Combine filters with AND; inclusive dueAfter/dueBefore bounds, UTC comparison. Inverted dates return 422. q is trimmed and split on whitespace; every search word must occur as a literal substring in at least one of number, description, proposedSolution or comments.text (AND across words, order independent). Search is case-insensitive and normalizes ё to е on both sides; no regex, SQL or morphology. Different words may match different fields. Stable order createdAt descending then id ascending. Empty results return 200 with items=[].",
        "tags": [
          "Complaints"
        ],
        "x-demo-steps": [
          2,
          5
        ],
        "x-roles": [
          "employee",
          "manager",
          "admin"
        ],
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ComplaintList"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "422": {
            "$ref": "#/components/responses/Validation"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        },
        "parameters": [
          {
            "name": "departmentId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100,
              "pattern": "^[A-Za-z0-9_-]+$"
            },
            "description": "Filter by author's department ID; unknown ID returns an empty list."
          },
          {
            "name": "categoryId",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 100,
              "pattern": "^[A-Za-z0-9_-]+$"
            },
            "description": "Filter by category ID; unknown ID returns an empty list."
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/Status"
            },
            "description": "Exact status; unknown value is 422."
          },
          {
            "name": "type",
            "in": "query",
            "required": false,
            "schema": {
              "$ref": "#/components/schemas/ComplaintType"
            },
            "description": "Exact type."
          },
          {
            "name": "dueAfter",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Deadline greater than or equal to this timestamp."
          },
          {
            "name": "dueBefore",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Deadline less than or equal to this timestamp."
          },
          {
            "name": "overdue",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean"
            },
            "description": "true selects overdue; false selects non-overdue. Omitted means both."
          },
          {
            "name": "queue",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "assigned",
                "unassigned"
              ]
            },
            "description": "Filter routing queue; assignment state is independent of status."
          },
          {
            "name": "q",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            "description": "Trimmed case-insensitive search words separated by whitespace, AND across words in number, description, proposedSolution and comments.text. Normalize ё and е to the same letter. Blank-only or more than 200 characters returns 422. Authorization, other filters and stable date/id ordering still apply."
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            },
            "description": "Page size."
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "minimum": 0,
              "default": 0
            },
            "description": "Number of matching records to skip."
          }
        ]
      }
    },
