  "x-demo-flow": [
    {
      "step": 1,
      "requirements": [
        "R1",
        "R5"
      ],
      "operations": [
        "getSession",
        "getReferenceData",
        "createComplaint"
      ],
      "scenario": "employee-1 creates problem with category, text, optional solution and a synthetic attachment placeholder."
    },
    {
      "step": 2,
      "requirements": [
        "R2"
      ],
      "operations": [
        "createComplaint",
        "getComplaint",
        "listComplaints",
        "assignComplaint"
      ],
      "scenario": "Create with category that has an assignee, then with one whose assigneeId is null. manager-1 sees queue=unassigned and assigns a manager."
    },
    {
      "step": 3,
      "requirements": [
        "R3"
      ],
      "operations": [
        "changeComplaintStatus",
        "addComment",
        "getComplaint"
      ],
      "scenario": "manager-1 moves new to in_review, posts clarification_request; employee-1 posts clarification_response, returning to in_review."
    },
    {
      "step": 4,
      "requirements": [
        "R4"
      ],
      "operations": [
        "recordDecision",
        "getComplaint"
      ],
      "scenario": "manager-1 records implemented on one reviewed complaint and rejected with explanation on another. Author reads both results."
    },
    {
      "step": 5,
      "requirements": [
        "R6"
      ],
      "operations": [
        "listComplaints",
        "getComplaint"
      ],
      "scenario": "manager-1 filters departmentId/categoryId/status/dueBefore/dueAfter/overdue and opens history."
    },
    {
      "step": 6,
      "requirements": [
        "R7"
      ],
      "operations": [
        "getSummary"
      ],
      "scenario": "admin-1 reads counts, closed share, mean first response and recurring category topics."
    }
  ],
